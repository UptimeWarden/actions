# UptimeWarden Heartbeat.
#
# A composite action that sends one `curl -X POST` to the UptimeWarden
# heartbeat endpoint. No Node, no Python, no install step: it runs on any
# runner that has bash and curl.

name: 'UptimeWarden Heartbeat'
description: 'Send a heartbeat ping to UptimeWarden from any CI step (cron, scheduled deploy, batch job).'
author: 'UptimeWarden'

branding:
  icon: 'activity'
  color: 'blue'

inputs:
  token:
    description: 'Heartbeat token (from /monitors/<id> in the UptimeWarden dashboard, or heartbeat_token in Terraform).'
    required: true
  state:
    description: '"success" pings /ping. "failure" calls /fail, which opens an incident within about 30 seconds instead of after the interval and grace.'
    required: false
    default: 'success'
  message:
    description: 'Optional message. On failure it becomes the incident error (the API keeps the first 500 characters).'
    required: false
    default: ''
  base-url:
    description: 'API base URL. Default: https://app.uptimewarden.online'
    required: false
    default: 'https://app.uptimewarden.online'

outputs:
  status:
    description: 'HTTP status code returned by the heartbeat endpoint.'
    value: ${{ steps.ping.outputs.status }}

runs:
  using: 'composite'
  steps:
    - name: Send heartbeat signal
      id: ping
      shell: bash
      env:
        UW_TOKEN: ${{ inputs.token }}
        UW_STATE: ${{ inputs.state }}
        UW_MESSAGE: ${{ inputs.message }}
        UW_BASE_URL: ${{ inputs.base-url }}
      run: |
        set -euo pipefail
        if [ -z "${UW_TOKEN}" ]; then
          echo "::error::heartbeat token is required"
          exit 1
        fi
        case "${UW_STATE}" in
          success) endpoint="ping" ;;
          failure) endpoint="fail" ;;
          *)
            echo "::error::state must be 'success' or 'failure' (got '${UW_STATE}')"
            exit 1
            ;;
        esac

        # JSON-escape the message without jq: backslashes, quotes, then
        # control characters (newlines, tabs, CR) become spaces.
        msg="${UW_MESSAGE//\\/\\\\}"
        msg="${msg//\"/\\\"}"
        msg="$(printf '%s' "${msg}" | tr '\n\r\t' '   ')"
        payload=$(printf '{"message":"%s","source":"github-actions"}' "${msg}")

        url="${UW_BASE_URL%/}/api/heartbeat/${UW_TOKEN}/${endpoint}"
        # Do not echo the URL: the token in it is the credential.
        echo "POST ${UW_BASE_URL%/}/api/heartbeat/***/${endpoint}"

        # --fail makes curl exit 22 on >=400, which fails the step.
        # --fail --show-error works on every curl (RHEL 8's 7.61 included).
        status=$(curl --fail --show-error \
          --silent \
          --max-time 30 \
          -X POST \
          -H "Content-Type: application/json" \
          -H "X-UW-Source: github-actions" \
          -H "User-Agent: uptimewarden-heartbeat-action/1.1" \
          --data "${payload}" \
          --output /dev/null \
          --write-out "%{http_code}" \
          "${url}")
        echo "status=${status}" >> "${GITHUB_OUTPUT}"
        if [ "${endpoint}" = "fail" ]; then
          echo "::notice::UptimeWarden failure reported (HTTP ${status}); the incident opens within about 30 seconds"
        else
          echo "::notice::UptimeWarden heartbeat sent (HTTP ${status})"
        fi

        # Job summary
        {
          if [ "${endpoint}" = "fail" ]; then
            echo "## UptimeWarden Heartbeat — failure reported"
          else
            echo "## UptimeWarden Heartbeat ✅"
          fi
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| State | \`${UW_STATE}\` |"
          echo "| HTTP status | \`${status}\` |"
          if [ -n "${UW_MESSAGE}" ]; then
            echo "| Message | ${msg} |"
          fi
        } >> "${GITHUB_STEP_SUMMARY}"
