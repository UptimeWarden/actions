# UptimeWarden Sync Monitors: Monitoring-as-Code in CI.
#
# Installs @uptimewarden/cli and runs `uw apply` against your config file.
# On pull requests it shows the plan (diff); on push to main it applies.
# Needs only a standard UptimeWarden API token.

name: 'UptimeWarden Sync Monitors'
description: 'Apply a Monitoring-as-Code config to UptimeWarden from CI. Dry-run on PRs, apply on push.'
author: 'UptimeWarden'

branding:
  icon: 'refresh-cw'
  color: 'blue'

inputs:
  api-token:
    description: 'UptimeWarden API token with Monitor Manager permissions.'
    required: true
  config-file:
    description: 'Path to the Monitoring-as-Code config file (JSON: { monitors: [...] }).'
    required: false
    default: 'monitors.uw.json'
  mode:
    description: |
      apply  — apply all changes (--yes). Use on push to main.
      diff   — show plan only, exit 2 if drift detected. Use on pull_request.
      plan   — show plan only, always exit 0. Use for informational runs.
    required: false
    default: 'apply'
  allow-delete:
    description: 'Allow deletion of monitors not in the config, and replacement (delete + create) of monitors whose type changed. Default false (both are shown but not applied).'
    required: false
    default: 'false'
  node-version:
    description: 'Node.js version used to run the CLI (20 or later).'
    required: false
    default: '22'
  base-url:
    description: 'API base URL (passed to the CLI as UW_API_URL). Default: https://app.uptimewarden.online'
    required: false
    default: 'https://app.uptimewarden.online'

outputs:
  created:
    description: 'Number of monitors created (0 in plan/diff mode).'
    value: ${{ steps.apply.outputs.created }}
  updated:
    description: 'Number of monitors updated (0 in plan/diff mode).'
    value: ${{ steps.apply.outputs.updated }}
  replaced:
    description: 'Number of monitors replaced because their type changed (0 unless allow-delete + apply mode).'
    value: ${{ steps.apply.outputs.replaced }}
  deleted:
    description: 'Number of monitors deleted (0 unless allow-delete + apply mode).'
    value: ${{ steps.apply.outputs.deleted }}
  has-drift:
    description: 'true if the config differed from live state before this run (from the CLI exit code of `uw apply --diff-only`).'
    value: ${{ steps.apply.outputs.has-drift }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install UptimeWarden CLI
      shell: bash
      run: npm install -g @uptimewarden/cli

    - name: Apply / Diff monitors
      id: apply
      shell: bash
      env:
        UW_API_TOKEN: ${{ inputs.api-token }}
        UW_API_URL: ${{ inputs.base-url }}
        UW_MODE: ${{ inputs.mode }}
        UW_ALLOW_DELETE: ${{ inputs.allow-delete }}
        UW_CONFIG_FILE: ${{ inputs.config-file }}
      run: |
        set -euo pipefail

        if [ -z "${UW_API_TOKEN}" ]; then
          echo "::error::api-token is required"
          exit 1
        fi

        case "${UW_MODE}" in
          apply|diff|plan) : ;;
          *)
            echo "::error::mode must be one of: apply, diff, plan (got '${UW_MODE}')"
            exit 1
            ;;
        esac

        if [ ! -f "${UW_CONFIG_FILE}" ]; then
          echo "::error::Config file not found: ${UW_CONFIG_FILE}"
          exit 1
        fi

        # The CLI reads UW_API_TOKEN and UW_API_URL from the environment, so
        # nothing is written to disk.
        common_args=(-f "${UW_CONFIG_FILE}" --base-url "${UW_API_URL}")
        if [ "${UW_ALLOW_DELETE}" = "true" ]; then
          common_args+=(--allow-delete)
        fi

        # 1. Plan. Drift comes from the CLI's exit code, not from parsing its
        #    text: `uw apply --diff-only` exits 0 without drift, 2 with drift
        #    and 1 on error.
        set +e
        plan_output=$(uw apply "${common_args[@]}" --diff-only 2>&1)
        plan_code=$?
        set -e
        echo "${plan_output}"

        case "${plan_code}" in
          0) has_drift="false" ;;
          2) has_drift="true" ;;
          *)
            echo "::error::uw apply (plan) failed with exit code ${plan_code}"
            echo "has-drift=unknown" >> "${GITHUB_OUTPUT}"
            exit "${plan_code}"
            ;;
        esac

        # 2. Apply (apply mode only, and only when there is something to do).
        output="${plan_output}"
        exit_code=0
        if [ "${UW_MODE}" = "apply" ] && [ "${has_drift}" = "true" ]; then
          set +e
          output=$(uw apply "${common_args[@]}" --yes 2>&1)
          exit_code=$?
          set -e
          echo "${output}"
        fi

        created=0
        updated=0
        replaced=0
        deleted=0
        if [ "${UW_MODE}" = "apply" ]; then
          # The CLI prints one "✓ created/updated/replaced/deleted" line per
          # monitor it changed.
          created=$(printf '%s\n' "${output}" | grep -c '✓ created' || true)
          updated=$(printf '%s\n' "${output}" | grep -c '✓ updated' || true)
          replaced=$(printf '%s\n' "${output}" | grep -c '✓ replaced' || true)
          deleted=$(printf '%s\n' "${output}" | grep -c '✓ deleted' || true)
        fi

        {
          echo "created=${created}"
          echo "updated=${updated}"
          echo "replaced=${replaced}"
          echo "deleted=${deleted}"
          echo "has-drift=${has_drift}"
        } >> "${GITHUB_OUTPUT}"

        # Job summary
        {
          case "${UW_MODE}" in
            apply)
              echo "## UptimeWarden Monitor Sync"
              echo ""
              if [ "${has_drift}" = "false" ]; then
                echo "No changes — monitors are in sync."
              else
                echo "| Created | Updated | Replaced | Deleted |"
                echo "|---------|---------|----------|---------|"
                echo "| ${created} | ${updated} | ${replaced} | ${deleted} |"
                if [ "${exit_code}" -ne 0 ]; then
                  echo ""
                  echo "Apply exited with code ${exit_code}:"
                  echo ""
                  echo "\`\`\`"
                  printf '%s\n' "${output}"
                  echo "\`\`\`"
                fi
              fi
              ;;
            diff|plan)
              if [ "${has_drift}" = "true" ]; then
                echo "## UptimeWarden Monitor Sync — drift detected"
              else
                echo "## UptimeWarden Monitor Sync — no drift"
              fi
              echo ""
              echo "\`\`\`"
              printf '%s\n' "${plan_output}"
              echo "\`\`\`"
              ;;
          esac
        } >> "${GITHUB_STEP_SUMMARY}"

        if [ "${exit_code}" -ne 0 ]; then
          exit "${exit_code}"
        fi
        if [ "${UW_MODE}" = "diff" ] && [ "${has_drift}" = "true" ]; then
          exit 2
        fi
