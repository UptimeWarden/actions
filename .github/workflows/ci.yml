name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
      - name: Lint workflows (validates local action references too)
        run: ./actionlint -color

  action-metadata:
    name: action.yml lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint action.yml files
        run: ./scripts/lint-actions.sh

  sync-monitors:
    name: sync-monitors behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the sync-monitors step against a stub CLI
        run: ./scripts/test-sync-monitors.sh

  heartbeat:
    name: heartbeat behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the heartbeat step against a stub curl
        run: ./scripts/test-heartbeat.sh
